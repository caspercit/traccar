# PostgreSQL en RDS
# REEMPLAZA el valor de abajo con tu endpoint real de RDS
# Ejemplo: cafesoftdb.abc123xyz.mx-central-1.rds.amazonaws.com
spring.datasource.url=jdbc:postgresql://${RDS_HOST}:${RDS_PORT:5432}/${RDS_DATABASE}
spring.datasource.username=${RDS_USER}
spring.datasource.password=${RDS_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Puerto
server.port=8080

# Swagger (puedes desactivarlo en prod si quieres)
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
